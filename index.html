<!doctype html><meta charset=utf-8><title>remove-background 探针</title>
<script src="./ort/ort.min.js"></script>
<style>body{font:15px/1.5 system-ui;margin:2rem;max-width:900px}canvas,img{max-width:100%;border:1px solid #ccc}pre{background:#f4f4f4;padding:.6rem}button{padding:.5rem 1rem}</style>
<h2>remove-background 探针（ISNet int8-weights 44 MB + onnxruntime-web 1.22）</h2>
<p>1. 选一张照片（人像/产品/复杂背景各试一张） 2. 点按钮 3. 把下面的数字截图发我。</p>
<input type=file id=f accept="image/*"> <button id=w>WASM 运行</button> <button id=g>WebGPU 运行</button>
<pre id=log>等待…</pre>
<div style="display:flex;gap:1rem"><img id=img style="width:45%"><canvas id=out style="width:45%;background:repeating-conic-gradient(#ccc 0 25%,#eee 0 50%) 0 0/16px 16px"></canvas></div>
<canvas id=c hidden></canvas>
<script>
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
let session = null, sessionEp = '';
async function loadModel() {
  const t0 = performance.now();
  const parts = await Promise.all(['isnet-w8.part00','isnet-w8.part01','isnet-w8.part02'].map(p => fetch('./model/' + p).then(r => r.arrayBuffer())));
  const total = parts.reduce((n, p) => n + p.byteLength, 0);
  const buf = new Uint8Array(total); let off = 0; for (const p of parts) { buf.set(new Uint8Array(p), off); off += p.byteLength; }
  log(`模型下载/读取 ${Math.round(total/1048576)} MB：${Math.round(performance.now()-t0)} ms`);
  return buf;
}
async function run(ep) {
  const file = document.getElementById('f').files[0]; if (!file) { log('先选图片'); return; }
  document.getElementById('log').textContent = `EP=${ep} · CPU 核心 ${navigator.hardwareConcurrency} · UA ${navigator.userAgent.slice(0,80)}`;
  ort.env.wasm.wasmPaths = '/ort/';
  ort.env.wasm.numThreads = 1;
  try {
    if (!session || sessionEp !== ep) {
      const buf = await loadModel();
      const t = performance.now();
      session = await ort.InferenceSession.create(buf, { executionProviders: [ep], graphOptimizationLevel: 'all' });
      sessionEp = ep;
      log(`会话创建（含编译）：${Math.round(performance.now()-t)} ms`);
    }
    const img = document.getElementById('img'); img.src = URL.createObjectURL(file); await img.decode();
    const c = document.getElementById('c'); c.width = 1024; c.height = 1024; const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, 1024, 1024);
    const d = ctx.getImageData(0, 0, 1024, 1024).data;
    const N = 1024 * 1024, x = new Float32Array(3 * N);
    for (let i = 0; i < N; i++) { x[i] = d[i*4]/255 - 0.5; x[N+i] = d[i*4+1]/255 - 0.5; x[2*N+i] = d[i*4+2]/255 - 0.5; }
    for (let k = 1; k <= 2; k++) {
      const t = performance.now();
      const out = await session.run({ input_image: new ort.Tensor('float32', x, [1, 3, 1024, 1024]) });
      log(`第 ${k} 次推理：${Math.round(performance.now()-t)} ms`);
      if (k === 2) {
        const m = out.output_image.data; let mn = 1e9, mx = -1e9; for (const v of m) { if (v < mn) mn = v; if (v > mx) mx = v; }
        const mc = document.createElement('canvas'); mc.width = mc.height = 1024; const mctx = mc.getContext('2d');
        const id = mctx.createImageData(1024, 1024);
        for (let i = 0; i < N; i++) { const a = Math.round(((m[i]-mn)/(mx-mn+1e-8))*255); id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=255; id.data[i*4+3]=a; }
        mctx.putImageData(id, 0, 0);
        const o = document.getElementById('out'); o.width = img.naturalWidth; o.height = img.naturalHeight; const octx = o.getContext('2d');
        octx.drawImage(img, 0, 0); octx.globalCompositeOperation = 'destination-in'; octx.drawImage(mc, 0, 0, o.width, o.height);
      }
    }
    log('完成');
  } catch (e) { log('失败：' + (e && e.message || e)); }
}
document.getElementById('w').onclick = () => run('wasm');
document.getElementById('g').onclick = () => run('webgpu');
</script>
